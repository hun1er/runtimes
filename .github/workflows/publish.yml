---
name: Build and Publish

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "docker-bake.hcl"
      - "runtimes/**"
      - "scripts/**"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU for multi-platform support
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Prepare build metadata
        id: prep
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Validate Bake build definition
        env:
          REGISTRY: ${{ steps.prep.outputs.registry }}
          REVISION: ${{ github.sha }}
          CREATED: ${{ steps.prep.outputs.created }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        run: |
          docker buildx bake --print

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images with SBOM and Provenance
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          REGISTRY: ${{ steps.prep.outputs.registry }}
          REVISION: ${{ github.sha }}
          CREATED: ${{ steps.prep.outputs.created }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          CACHE_FROM: type=gha
          CACHE_TO: type=gha,mode=max
        with:
          source: .
          targets: default
          push: true
          provenance: mode=max
          sbom: true

      - name: Sign published images with Cosign (Keyless OIDC)
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          REGISTRY: ${{ steps.prep.outputs.registry }}
        run: |
          echo "${METADATA}" | jq -r 'to_entries[].value["containerimage.digest"] // empty' | sort -u | while read -r digest; do
            if [ -n "${digest}" ]; then
              echo "Signing ${REGISTRY}/runtime@${digest}..."
              cosign sign --yes "${REGISTRY}/runtime@${digest}"
            fi
          done
